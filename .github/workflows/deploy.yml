name: Deploy Theme
on:
  push:
    branches:
      - main
    tags:
      - "*"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Deploy Ghost Theme
        uses: TryGhost/action-deploy-theme@v2
        with:
          api-url: ${{ secrets.GHOST_ADMIN_API_URL }}
          api-key: ${{ secrets.GHOST_ADMIN_API_KEY }}
          version: v5.0
          # Ghost never reads AGENTS.md/routes.yaml/redirects.yaml/node_modules
          # from a theme zip, so the action already excludes those by default.
          # Everything below is repo-local tooling and dev artifacts that
          # Ghost doesn't need either — see Gulpfile.js's `bundle` task, which
          # excludes the same set for `npm run zip`.
          exclude: "docs* scripts* .devcontainer* .vscode* Gulpfile.js package-lock.json screenshot.png assets/css* assets/images* *.map *.DS_Store"
